name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Attest (Java 25)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      version_type: ${{ steps.meta.outputs.version_type }}
      minecraft_version: ${{ steps.meta.outputs.minecraft_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag and pluginVersion
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          SEMVER_CORE_RE='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          PRE_ID_RE='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          TAG_RE="^v${SEMVER_CORE_RE}(-${PRE_ID_RE}(\.${PRE_ID_RE})*)?$"

          if [[ ! "$TAG_NAME" =~ $TAG_RE ]]; then
            echo "::error::Tag '$TAG_NAME' does not match SemVer 2.0.0 format vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi

          TAG_VERSION="${TAG_NAME#v}"
          PLUGIN_VERSION="$(sed -nE 's/^pluginVersion[[:space:]]*=[[:space:]]*([^[:space:]#]+).*/\1/p' gradle.properties | head -n 1 | tr -d '\r')"
          MC_VERSION="$(sed -nE 's/^minecraftVersion[[:space:]]*=[[:space:]]*([^[:space:]#]+).*/\1/p' gradle.properties | head -n 1 | tr -d '\r')"

          if [[ -z "$PLUGIN_VERSION" ]]; then
            echo "::error::Could not read pluginVersion from gradle.properties."
            exit 1
          fi

          if [[ -z "$MC_VERSION" ]]; then
            echo "::error::Could not read minecraftVersion from gradle.properties."
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$PLUGIN_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match gradle.properties pluginVersion ($PLUGIN_VERSION)."
            exit 1
          fi

          PRERELEASE="false"
          VERSION_TYPE="release"
          if [[ "$TAG_VERSION" == *-* ]]; then
            PRERELEASE="true"
            PRE_TAG="${TAG_VERSION#*-}"
            if [[ "${PRE_TAG,,}" == alpha* || "${PRE_TAG,,}" == *alpha* ]]; then
              VERSION_TYPE="alpha"
            else
              VERSION_TYPE="beta"
            fi
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run checks and build plugin JAR
        run: ./gradlew check shadowJar --stacktrace

      - name: Prepare release assets and SHA-256 checksum
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          JAR_NAME="ClickPortals-${VERSION}.jar"
          if [[ ! -f "build/libs/${JAR_NAME}" ]]; then
            echo "::error::Expected JAR build/libs/${JAR_NAME} was not produced."
            exit 1
          fi
          mkdir -p dist
          cp "build/libs/${JAR_NAME}" "dist/${JAR_NAME}"
          (cd dist && sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256")

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ClickPortals-${{ steps.meta.outputs.version }}.jar

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify SHA-256 checksum
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "ClickPortals-${VERSION}.jar.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          ARGS=(
            "$TAG_NAME"
            "dist/ClickPortals-${VERSION}.jar"
            "dist/ClickPortals-${VERSION}.jar.sha256"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "$TAG_NAME"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

  modrinth:
    name: Publish to Modrinth
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify SHA-256 checksum
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "ClickPortals-${VERSION}.jar.sha256")

      - name: Extract GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > release_notes.md

      - name: Upload version to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_SLUG: ${{ vars.MODRINTH_PROJECT_ID || 'clickportals' }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_TYPE: ${{ needs.build.outputs.version_type }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
          MC_VERSION: ${{ needs.build.outputs.minecraft_version }}
        run: |
          set -euo pipefail

          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "::error::Secret MODRINTH_TOKEN is not configured."
            exit 1
          fi

          USER_AGENT="ikafly144/clickportals/${VERSION} (https://github.com/${GITHUB_REPOSITORY})"
          JAR_FILE="dist/ClickPortals-${VERSION}.jar"

          PROJECT_ID="$(curl -fsSL -H "User-Agent: ${USER_AGENT}" "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_SLUG}" | jq -er '.id')"

          resolve_dependency() {
            local slug="$1"
            local dep_type="$2"
            local resp
            if resp="$(curl -fsSL -H "User-Agent: ${USER_AGENT}" "https://api.modrinth.com/v2/project/${slug}" 2>/dev/null)"; then
              local dep_id
              dep_id="$(printf '%s' "$resp" | jq -er '.id // empty')"
              if [[ -n "$dep_id" ]]; then
                jq -cn --arg id "$dep_id" --arg type "$dep_type" '{project_id: $id, dependency_type: $type}'
                return 0
              fi
            fi
            echo "::warning::Could not resolve Modrinth project for dependency '${slug}'; skipping dependency entry." >&2
          }

          DEPS_JSON="[]"
          add_dep() {
            local dep_json="$1"
            if [[ -n "$dep_json" ]]; then
              DEPS_JSON="$(jq -cn --argjson arr "$DEPS_JSON" --argjson item "$dep_json" '$arr + [$item]')"
            fi
          }

          add_dep "$(resolve_dependency "packetevents" "required")"
          add_dep "$(resolve_dependency "bettermodel" "required")"
          # Vault / VaultUnlocked optional integration
          VAULT_DEP="$(resolve_dependency "vault" "optional")"
          if [[ -z "$VAULT_DEP" ]]; then
            VAULT_DEP="$(resolve_dependency "vaultunlocked" "optional")"
          fi
          add_dep "$VAULT_DEP"

          FEATURED="true"
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            FEATURED="false"
          fi

          CHANGELOG="$(cat release_notes.md)"
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="Release ${VERSION}"
          fi

          PAYLOAD="$(jq -cn \
            --arg name "ClickPortals ${VERSION}" \
            --arg version_number "${VERSION}" \
            --arg changelog "${CHANGELOG}" \
            --argjson dependencies "${DEPS_JSON}" \
            --arg mc_version "${MC_VERSION}" \
            --arg version_type "${VERSION_TYPE}" \
            --argjson featured "${FEATURED}" \
            --arg project_id "${PROJECT_ID}" \
            '{
              name: $name,
              version_number: $version_number,
              changelog: $changelog,
              dependencies: $dependencies,
              game_versions: [$mc_version],
              version_type: $version_type,
              loaders: ["paper", "folia"],
              featured: $featured,
              status: "listed",
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file"
            }')"

          curl --fail-with-body -sSL -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: ${USER_AGENT}" \
            -F "data=${PAYLOAD}" \
            -F "file=@${JAR_FILE}"
