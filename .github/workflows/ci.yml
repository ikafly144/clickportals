name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks and build plugin JAR
        run: ./gradlew check shadowJar --stacktrace

      - name: Upload plugin JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClickPortals
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
