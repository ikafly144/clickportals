changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels:
        - type:breaking
    - title: Features
      labels:
        - type:feature
    - title: Bug Fixes
      labels:
        - type:bug
    - title: Documentation
      labels:
        - type:docs
    - title: Maintenance & Dependencies
      labels:
        - type:task
        - area:build
    - title: Other Changes
      labels:
        - "*"
