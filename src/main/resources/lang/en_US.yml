    category-world-nether: "<red>🔥 <world></red><current> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-world-end: "<light_purple>🌌 <world></light_purple><current> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-world-custom: "<aqua>✦ <world></aqua><current> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-world-current-badge: " <aqua>(Current)</aqua>"
    category-world-tooltip: "<gray>Show warp destinations in </gray><white><world></white> <gray>(<count>)</gray>"
    category-all: "<aqua>🔍 All Worlds / Search</aqua> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-all-tooltip: "<gray>Browse and search all reachable Aetherytes across worlds</gray>"
    page-indicator: "<gray>Page <current> / <total> (<count> items)</gray>"
    search-input-label: "<aqua>Search (Name / Owner)</aqua>"
    sort-button: "<yellow>⇅ Sort: </yellow><white><sort></white>"
    sort-tooltip: "<gray>Click to cycle sort order</gray>"
    sort:
      distance: "Distance"
      name: "Name"
      owner: "Owner"
      created: "Created"
    list-header: "<gray>View: </gray><white><scope></white> <dark_gray>|</dark_gray> <gray>Sort: </gray><white><sort></white>"
    list-header-search: "<newline><gray>Filter: </gray><aqua><query></aqua>"
    list-empty-filtered: "<yellow>No Aetherytes match the current filter.</yellow>"
    scope-favorites: "★ Favorites"
    scope-all: "All Worlds"
    favorite-badge: "<gold>★ </gold>"
    favorite-edit-off: "<gray>☆ Edit Favorites: OFF</gray>"
    favorite-edit-on: "<gold>★ Edit Favorites: ON (Click items to toggle)</gold>"
    favorite-edit-tooltip: "<gray>While ON, clicking a destination toggles favorite status instead of warping</gray>"
    favorite-empty: "<yellow>You have no favorite Aetherytes yet.</yellow><newline><gray>Use \"Edit Favorites\" in destination lists or the Operations page to add one.</gray>"
    tooltip-favorite-toggle: "<gold>Click to toggle favorite</gold>"
    destination-available: "<aqua>✦ </aqua><white><name></white> <dark_gray>(</dark_gray><aqua><owner></aqua><dark_gray>)</dark_gray><dark_gray> [</dark_gray><cost><dark_gray>]</dark_gray>"
    destination-unavailable: "<red>✖ </red><gray><name></gray> <dark_gray>(</dark_gray><gray><owner></gray><dark_gray>)</dark_gray><dark_gray> [</dark_gray><cost><dark_gray>]</dark_gray>"
    distance-blocks: "<white><blocks> blocks</white>"
    distance-other-dimension: "<light_purple>Other dimension</light_purple>"
    tooltip-allowed: "<gray>Owner: </gray><aqua><owner></aqua><newline><gray>World: </gray><gold><world></gold><newline><gray>Coordinates: </gray><white><x>, <y>, <z></white><newline><gray>Distance: </gray><distance><newline><gray>Cost: </gray><cost><newline><green>Click to warp</green>"
    tooltip-denied: "<gray>Owner: </gray><aqua><owner></aqua><newline><gray>World: </gray><gold><world></gold><newline><gray>Coordinates: </gray><white><x>, <y>, <z></white><newline><gray>Distance: </gray><distance><newline><gray>Cost: </gray><cost><newline><red>Unavailable: </red><reason>"
    unknown-owner: "Unknown"
  remove:
    title: "<red><bold>Confirm Removal: </bold></red><white><name></white>"
    body: "<gray>Are you sure you want to remove \"</gray><white><name></white><gray>\"?</gray><newline><yellow>The Aetheryte item will be returned to you.</yellow>"
  operations:
    title: "<aqua>⚙ Operations: </aqua><white><bold><name></bold></white>"
    body: "<gray>Name: </gray><white><name></white><newline><gray>Owner: </gray><aqua><owner></aqua><newline><gray>World: </gray><gold><world></gold> <white>(<x>, <y>, <z>)</white><newline><gray>Variation: </gray><variation>"
  rename:
    title: "<aqua><bold>Rename Aetheryte</bold></aqua>"
    body: "<gray>Current name: </gray><white><name></white>"
    input-label: "<aqua>New Aetheryte Name</aqua>"
  force-remove:
    title: "<dark_red><bold>Confirm Force Removal: </bold></dark_red><white><name></white>"
    body: "<gray>Are you sure you want to force-remove \"</gray><white><name></white><gray>\"?</gray><newline><red>No Aetheryte item will be refunded.</red>"
  transfer:
    title: "<gold><bold>Transfer Ownership: </bold></gold><white><name></white>"
    body: "<gray>Current owner: </gray><aqua><owner></aqua><newline><gray>Enter the target player's name.</gray>"
    input-label: "<gold>Target Player Name</gold>"
  variation:
    title: "<light_purple><bold>Change Variation: </bold></light_purple><white><name></white>"
    body: "<gray>Current variation: </gray><white><variation></white><newline><gray>Select the variation preset to apply.</gray>"
    select-label: "<light_purple>Variation</light_purple>"

aetheryte:
  created: "<prefix><green>Placed Aetheryte \"</green><white><bold><name></bold></white><green>\".</green>"
  removed: "<prefix><yellow>Removed Aetheryte \"</yellow><white><bold><name></bold></white><yellow>\".</yellow>"
  cost-paid: "<prefix><gray>Paid <cost> for Aetheryte placement.</gray>"
  renamed: "<prefix><green>Renamed Aetheryte \"<old_name>\" to \"</green><white><bold><name></bold></white><green>\".</green>"
  force-removed: "<prefix><yellow>Force-removed Aetheryte \"</yellow><white><bold><name></bold></white><yellow>\" (no item refunded).</yellow>"
  owner-transferred: "<prefix><green>Transferred ownership of \"<name>\" to </green><white><bold><owner></bold></white><green>.</green>"
  variation-changed: "<prefix><green>Changed variation of \"<name>\" to </green><white><bold><variation></bold></white><green>.</green>"
  visuals-resynced: "<prefix><aqua>Resynchronized visuals for Aetheryte \"<name>\".</aqua>"

warp:
  success: "<prefix><aqua>Warped to \"</aqua><white><bold><name></bold></white><aqua>\".</aqua>"
  cost-paid: "<prefix><gray>Paid <cost> for warp.</gray>"

