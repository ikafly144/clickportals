# ClickPortals Language File (en_US)
# Uses Adventure MiniMessage format: https://docs.advntr.dev/minimessage/format.html

prefix: "<dark_gray>[<aqua>ClickPortals</aqua>]</dark_gray> "

item:
  name: "<!italic><bold><aqua>Aetheryte</aqua></bold>"
  lore:
    - "<!italic><gray>Right-click a block to place</gray>"
    - "<!italic><gray>an Aetheryte (warp point).</gray>"

hologram:
  title: "<aqua>✦ </aqua><white><bold><name></bold></white><aqua> ✦</aqua>"

cost:
  free: "<green>Free</green>"
  bypassed: "<strikethrough><cost></strikethrough> <green>(Bypassed)</green>"
  separator: "<dark_gray> + </dark_gray>"
  vault: "<gold><amount></gold>"
  exp-points: "<green><amount> XP</green>"
  exp-levels: "<green><amount> Lv</green>"
  food: "<yellow><amount> 🍗</yellow>"
  insufficient:
    vault: "<red>Not enough money (need <amount>)</red>"
    exp-points: "<red>Not enough experience points (need <amount> XP)</red>"
    exp-levels: "<red>Not enough experience levels (need <amount> Lv)</red>"
    food: "<red>Not enough hunger (need <amount> 🍗)</red>"

dialog:
  create:
    title: "<aqua><bold>Place Aetheryte</bold></aqua>"
    description: "<gray>Target coordinates: </gray><white><world> (<x>, <y>, <z>)</white>"
    variation: "<gray>Variation: </gray><variation>"
    cost: "<gray>Placement cost: </gray><cost>"
    cost-bypassed: "<gray>Placement cost: </gray><strikethrough><cost></strikethrough> <green>(Bypassed)</green>"
    name-input-label: "<aqua>Aetheryte Name</aqua>"
    default-name: "<player>'s Aetheryte"
  button:
    confirm-create: "<green><bold>Place</bold></green>"
    cancel: "<gray>Cancel</gray>"
    close: "<gray>Close</gray>"
    open-remove-confirm: "<red>Remove this Aetheryte</red>"
    open-remove-confirm-tooltip: "<gray>Remove this Aetheryte and reclaim the item</gray>"
    confirm-remove: "<red><bold>Remove</bold></red>"
    back: "<gray>← Back</gray>"
    prev-page: "<aqua>◀ Previous</aqua>"
    next-page: "<aqua>Next ▶</aqua>"
    apply-search: "<aqua>🔍 Search / Apply</aqua>"
    clear-search: "<gray>✖ Clear Search</gray>"
    favorite-add: "<gold>☆ Add to Favorites</gold>"
    favorite-remove: "<gold>★ Remove from Favorites</gold>"
    open-operations: "<gray>⚙ Operations & Management</gray>"
    open-operations-tooltip: "<gray>Manage favorites, rename, remove, or run admin actions</gray>"
    open-rename: "<aqua>✏ Rename Aetheryte</aqua>"
    open-rename-tooltip: "<gray>Change the display name of this Aetheryte</gray>"
    confirm-rename: "<green><bold>Rename</bold></green>"
    admin-force-remove: "<dark_red>🗑 [Admin] Force Remove (No Refund)</dark_red>"
    admin-force-remove-tooltip: "<gray>Delete this Aetheryte without returning an item</gray>"
    confirm-force-remove: "<dark_red><bold>Force Remove</bold></dark_red>"
    admin-transfer: "<gold>👤 [Admin] Transfer Ownership</gold>"
    admin-transfer-tooltip: "<gray>Assign this Aetheryte to another player</gray>"
    confirm-transfer: "<gold><bold>Transfer</bold></gold>"
    admin-variation: "<light_purple>✨ [Admin] Change Variation</light_purple>"
    admin-variation-tooltip: "<gray>Switch the variation preset of this Aetheryte</gray>"
    confirm-variation: "<light_purple><bold>Change Variation</bold></light_purple>"
    admin-resync: "<aqua>🔄 [Admin] Resync Visuals</aqua>"
    admin-resync-tooltip: "<gray>Respawn hologram and BetterModel entities for this Aetheryte</gray>"
  warp:
    title: "<aqua>✦ Aetheryte: </aqua><white><bold><name></bold></white>"
    body-empty: "<gray>Current location: </gray><white><name></white> <dark_gray>(</dark_gray><gray>Owner: </gray><aqua><owner></aqua><dark_gray>)</dark_gray><newline><yellow>No other Aetherytes are available to warp to yet.</yellow>"
