    header: "<gray>現在地: </gray><white><name></white> <dark_gray>(</dark_gray><gray>持ち主: </gray><aqua><owner></aqua><dark_gray>)</dark_gray><newline><gray>座標: </gray><white><world> (<x>, <y>, <z>)</white>"
    body-empty: "<yellow>ワープ可能な他のエーテライトがまだありません。</yellow>"
    body-no-route: "<yellow>他のディメンションへ接続可能なルートがありません。</yellow>"
    body-dimension-disabled: "<red>現在のディメンションではエーテライトからのワープが無効化されています。</red>"
    body-select: "<gray>ワープ先のエーテライトを選択してください。</gray>"
    root-body: "<gray>カテゴリを選択してください。</gray>"
    category-favorites: "<gold>★ お気に入り</gold> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-favorites-tooltip: "<gray>お気に入り登録したエーテライト一覧を開きます</gray>"
    category-world-overworld: "<green>🌍 <world></green><current> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-world-nether: "<red>🔥 <world></red><current> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-world-end: "<light_purple>🌌 <world></light_purple><current> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-world-custom: "<aqua>✦ <world></aqua><current> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-world-current-badge: " <aqua>(現在地)</aqua>"
    category-world-tooltip: "<gray>ワールド「</gray><white><world></white><gray>」のワープ先（<count>件）を表示します</gray>"
    category-all: "<aqua>🔍 すべて表示 / 横断検索</aqua> <dark_gray>(</dark_gray><white><count></white><dark_gray>)</dark_gray>"
    category-all-tooltip: "<gray>到達可能な全ワールドのエーテライトを検索・表示します</gray>"
    page-indicator: "<gray>ページ <current> / <total>（<count>件）</gray>"
    search-input-label: "<aqua>検索（名前・持ち主）</aqua>"
    sort-button: "<yellow>⇅ 並び替え: </yellow><white><sort></white>"
    sort-tooltip: "<gray>クリックして並び替え順を切り替えます</gray>"
    sort:
      distance: "距離順"
      name: "名前順"
      owner: "持ち主順"
      created: "作成順"
    list-header: "<gray>一覧: </gray><white><scope></white> <dark_gray>|</dark_gray> <gray>並び替え: </gray><white><sort></white>"
    list-header-search: "<newline><gray>検索中: </gray><aqua><query></aqua>"
    list-empty-filtered: "<yellow>条件に一致するワープ先が見つかりません。</yellow>"
    scope-favorites: "★ お気に入り"
    scope-all: "すべて"
    favorite-badge: "<gold>★ </gold>"
    favorite-edit-off: "<gray>☆ お気に入り編集: OFF</gray>"
    favorite-edit-on: "<gold>★ お気に入り編集: ON（クリックで登録/解除）</gold>"
    favorite-edit-tooltip: "<gray>ON の間、ワープ先をクリックするとお気に入り登録/解除を行います</gray>"
    favorite-empty: "<yellow>お気に入りに登録されたエーテライトはまだありません。</yellow><newline><gray>一覧画面の「お気に入り編集」や操作ページから登録できます。</gray>"
    tooltip-favorite-toggle: "<gold>クリックしてお気に入り登録 / 解除</gold>"
    destination-available: "<aqua>✦ </aqua><white><name></white> <dark_gray>(</dark_gray><aqua><owner></aqua><dark_gray>)</dark_gray><dark_gray> [</dark_gray><cost><dark_gray>]</dark_gray>"
    destination-unavailable: "<red>✖ </red><gray><name></gray> <dark_gray>(</dark_gray><gray><owner></gray><dark_gray>)</dark_gray><dark_gray> [</dark_gray><cost><dark_gray>]</dark_gray>"
    distance-blocks: "<white><blocks> ブロック</white>"
    distance-other-dimension: "<light_purple>別ディメンション</light_purple>"
    tooltip-allowed: "<gray>持ち主: </gray><aqua><owner></aqua><newline><gray>ワールド: </gray><gold><world></gold><newline><gray>座標: </gray><white><x>, <y>, <z></white><newline><gray>距離: </gray><distance><newline><gray>コスト: </gray><cost><newline><green>クリックしてワープ</green>"
    tooltip-denied: "<gray>持ち主: </gray><aqua><owner></aqua><newline><gray>ワールド: </gray><gold><world></gold><newline><gray>座標: </gray><white><x>, <y>, <z></white><newline><gray>距離: </gray><distance><newline><gray>コスト: </gray><cost><newline><red>ワープ不可: </red><reason>"
    unknown-owner: "不明"
  remove:
    title: "<red><bold>エーテライトの撤去確認: </bold></red><white><name></white>"
    body: "<gray>本当に「</gray><white><name></white><gray>」を撤去しますか？</gray><newline><yellow>撤去するとエーテライトアイテムが返却されます。</yellow>"
  operations:
    title: "<aqua>⚙ エーテライト操作: </aqua><white><bold><name></bold></white>"
    body: "<gray>名前: </gray><white><name></white><newline><gray>持ち主: </gray><aqua><owner></aqua><newline><gray>ワールド: </gray><gold><world></gold> <white>(<x>, <y>, <z>)</white><newline><gray>種類: </gray><variation>"
  rename:
    title: "<aqua><bold>エーテライト名の変更</bold></aqua>"
    body: "<gray>現在の名前: </gray><white><name></white>"
    input-label: "<aqua>新しいエーテライト名</aqua>"
  force-remove:
    title: "<dark_red><bold>強制削除の確認: </bold></dark_red><white><name></white>"
    body: "<gray>本当に「</gray><white><name></white><gray>」を強制削除しますか？</gray><newline><red>アイテムは返却されません。</red>"
  transfer:
    title: "<gold><bold>所有者の変更: </bold></gold><white><name></white>"
    body: "<gray>現在の所有者: </gray><aqua><owner></aqua><newline><gray>新しい所有者のプレイヤー名を入力してください。</gray>"
    input-label: "<gold>プレイヤー名</gold>"
  variation:
    title: "<light_purple><bold>種類の変更: </bold></light_purple><white><name></white>"
    body: "<gray>現在の種類: </gray><white><variation></white><newline><gray>変更先のバリエーションを選択してください。</gray>"
    select-label: "<light_purple>バリエーション</light_purple>"

aetheryte:
  created: "<prefix><green>エーテライト「</green><white><bold><name></bold></white><green>」を設置しました。</green>"
  removed: "<prefix><yellow>エーテライト「</yellow><white><bold><name></bold></white><yellow>」を撤去しました。</yellow>"
  cost-paid: "<prefix><gray>エーテライトの設置費用として <cost> を支払いました。</gray>"
  renamed: "<prefix><green>エーテライト「<old_name>」の名前を「</green><white><bold><name></bold></white><green>」に変更しました。</green>"
  force-removed: "<prefix><yellow>エーテライト「</yellow><white><bold><name></bold></white><yellow>」を強制削除しました（アイテム返却なし）。</yellow>"
  owner-transferred: "<prefix><green>エーテライト「<name>」の所有者を </green><white><bold><owner></bold></white><green> に変更しました。</green>"
