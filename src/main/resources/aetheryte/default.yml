# ClickPortals Aetheryte Variation (default)
# Place additional <type>.yml files in this directory to create custom Aetheryte variations.

# Display name of this Aetheryte variation in MiniMessage format
display-name: "<aqua>Aetheryte</aqua>"

# Creation item settings for this variation
item:
  # Base Bukkit Material for the creation item (vanilla item components are masked)
  material: COMPASS
  # Custom item display name in MiniMessage format (leave empty to use localized default from lang/*.yml)
  name: ""
  # Custom item lore lines in MiniMessage format (leave empty to use localized default from lang/*.yml)
  lore: []
  # Optional resource pack item_model key (e.g. myserver:aetheryte)
  item-model: ""
  # Optional minecraft:custom_model_data component values
  custom-model-data:
    floats: []
    flags: []
    strings: []
    colors: []
  # Whether to apply enchantment glint to the creation item
  glint: true

# Crafting recipe settings for this variation
recipe:
  # Whether this variation can be crafted
  enabled: true
  # 3x3 crafting grid shape (1-3 rows, 1-3 characters per row)
  shape:
    - SSS
    - SAS
    - SSS
  # Mapping of shape characters to Bukkit Material names
  ingredients:
    S: CHISELED_STONE_BRICKS
    A: AMETHYST_SHARD

# Client-side visual model settings (BLOCK_DISPLAY)
model:
  # Block state string displayed via BLOCK_DISPLAY (e.g. minecraft:lodestone)
  block: minecraft:lodestone
  # 3D scale vector [x, y, z] applied to the display entity
  scale:
    - 1.0
    - 1.0
    - 1.0
  # 3D translation offset [x, y, z] applied to the display entity
  translation:
    - 0.0
    - 0.0
    - 0.0
  # Vertical offset in blocks above the Aetheryte origin for the floating name hologram
  name-height: 1.35

# Client-side INTERACTION entity hitbox dimensions in blocks
hitbox:
  width: 1.0
  height: 1.0

# Teleport destination spread and orientation settings
teleport:
  # Minimum horizontal distance radius in blocks from the Aetheryte to land (inner ring radius, 1..max-radius)
  min-radius: 1
  # Maximum horizontal distance radius in blocks around the Aetheryte to search for a safe landing spot (outer ring radius, 1..8)
  max-radius: 1
  # Whether to orient the arriving player to face toward the Aetheryte when landing in the surrounding ring
  face-aetheryte: true

# Placement validation and surrounding clearance requirements
placement:
  clearance:
    # Horizontal radius in blocks around the origin that must be replaceable/empty (0 = origin column only, max 8)
    radius: 0
    # Vertical height in blocks from the origin upward that must be replaceable/empty (1-16, default 2)
    height: 2
  # Required costs to place this variation (empty = free) (#15)
  cost: []
  # Minimum block distance to another Aetheryte in the same world (-1 to inherit global, 0 to disable)
  min-distance: -1.0

# Optional warp overrides applied when warping from this variation (#14, #26)
warp:
  distance:
    # Minimum warp distance (-1 to inherit global config)
    min: -1.0
    # Maximum warp distance (-1 to inherit global config)
    max: -1.0
    # Whether distance limits (min/max) apply to cross-dimension warps (null to inherit global)
    cross-dimension: null
  # Cost override for warps originating from this variation (null to inherit global, [] for free)
  cost: null

# Per-player placement limit and cooldown for this variation
limit:
  # Maximum number of Aetherytes of this variation a single player may own (-1 for unlimited)
  max-per-player: -1
  # Cooldown in ticks after placing this variation (-1 to use global limits.placement-cooldown-ticks, 0 to disable)
  cooldown-ticks: -1

# BetterModel animated 3D model engine settings (#46)
bettermodel:
  # Whether to render this variation using BetterModel (falls back to model.block if false or plugin is absent)
  enabled: false
  # Model identifier registered in BetterModel (e.g. aetheryte_crystal)
  model-id: ""
  # Event-driven animations
  animations:
    # Looping idle animation name
    idle: "idle"
    # Animation played when a player interacts with the Aetheryte (leave empty to disable)
    on-interact: ""
    # Animation played when a player warps away from this Aetheryte (leave empty to disable)
    on-warp-depart: ""
    # Animation played when a player arrives at this Aetheryte (leave empty to disable)
    on-warp-arrive: ""
