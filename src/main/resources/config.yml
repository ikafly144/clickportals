# ClickPortals Configuration

# Language and localization settings
language:
  # Fallback locale used for console messages, item names, and unsupported client locales (e.g. en_US, ja_JP)
  default-locale: en_US
  # Whether to automatically switch player-facing messages and holograms to match the player's client language
  use-client-locale: true

# Client-side visual and interaction (PacketEvents Display & Interaction) settings
hologram:
  # Whether PacketEvents client-side displays and interaction hitboxes are enabled
  enabled: true
  # View distance for holograms and models in blocks (minimum 4.0)
  view-distance: 32.0
  # Opt-in fallback that re-renders client visuals at 5 and 20 ticks after join, respawn, world change, or warp (disabled by default to avoid flickering)
  delayed-refresh-fallback: false

# Global per-player Aetheryte placement limit and cooldown settings
limits:
  # Maximum total Aetherytes a single player may own across all variations (-1 for unlimited)
  max-aetherytes-per-player: -1
  # Default cooldown in ticks after placing an Aetheryte before placing another (100 = 5 seconds, 0 to disable)
  placement-cooldown-ticks: 100
  # Minimum required block distance between Aetherytes in the same world (0 to disable)
  min-distance-between-aetherytes: 0.0
  # Maximum number of favorite Aetherytes a player can save (-1 for unlimited, 0 to disable)
  max-favorites-per-player: -1
  # Maximum total Aetheryte networks a single player may own (-1 for unlimited) (#27)
  max-networks-per-player: -1

# Global warping settings: distance boundaries, costs, and display (#14, #26)
warp:
  # Distance limitations for warping in blocks
  distance:
    # Minimum required distance between Aetherytes to warp (0 for no limit)
    min: 0.0
    # Maximum allowed distance between Aetherytes to warp (-1 for unlimited)
    max: -1.0
    # Whether distance limits (min/max) apply to cross-dimension warps (true by default)
    cross-dimension: true
  # Base warp cost specifications (all entries must be satisfied; $block_distance, $chunk_distance, $balance, etc. available)
  cost: []
  # Whether non-mandatory costs (required: false) are shown in destination menus and tooltips
  show-optional-costs: true
  # Default warp casting (cast time and BetterModel player animation) settings (#65)
  cast:
    # Cast time in ticks before warping (0 or less for instant warp)
    ticks: 0
    # BetterModel player limb model name used for player animations (e.g. steve)
    player-model: "steve"
    # BetterModel player animation played during casting (HOLD_ON_LAST; empty to disable)
    cast-animation: ""
    # BetterModel player animation played after teleport arrival (PLAY_ONCE; empty to disable)
    arrive-animation: ""
    # Whether to prevent the player from moving via PacketEvents while casting (head rotation remains allowed)
    immobilize: true
    # Cancellation conditions while casting
    cancel:
      # Cancel casting when the player moves (coordinate change; head rotation is allowed)
      on-move: true
      # Cancel casting when the player takes damage
      on-damage: true
      # Cancel casting when breaking/placing blocks, attacking entities, or interacting with other blocks/entities
      on-interact: true
  # Cost overrides per destination visibility mode (null = use base cost, [] = free) (#25)
  visibility-cost:
    public: null
    invite-only: null
    owner-only: null
  # Leashed entity warping settings (#22)
  pets:
    # Whether entities leashed to the warping player teleport along with them
    enabled: true
    # Maximum leashed entities allowed to warp together (-1 for unlimited, 0 to disable)
    max-entities: 5
    # Additional warp cost specifications when warping with leashed entities ($pet_count available)
    cost: []

# Cross-dimension warping routes, distance origins, and dimension pricing (#9)
dimensions:
  # Default cost specifications applied per dimension amount ($amount represents the evaluated dimension amount)
  default-cost:
    - type: vault
      amount: "$amount"
      required: true
    - type: exp-levels
      amount: "3"
      required: false
  # Base dimension amounts per world name
  amounts:
    world: 0.0
    world_nether: 30.0
    world_the_end: 100.0
  # Per-world display names (MiniMessage) and Aetheryte placement/usage restrictions (#63)
  worlds:
    world:
      display-name: ""
      allow-place: true
      allow-use: true
    world_nether:
      display-name: ""
      allow-place: true
      allow-use: true
    world_the_end:
      display-name: ""
      allow-place: true
      allow-use: true
  # Inter-dimensional connections and coordinate origins
  routes:
    - between: [world, world_nether]
      origin:
        world: { type: scale, ratio: 8.0 }
        world_nether: { type: scale, ratio: 0.125 }
    - between: [world, world_the_end]
      origin:
        world: { type: spawn }
        world_the_end: { type: fixed, x: 0.0, z: 0.0 }
      cost-override:
        world_the_end:
          amount: "$default + 300"

# Automatic update check settings using the Modrinth API (#76)
update-checker:
  # Whether to automatically check Modrinth for newer ClickPortals releases
  enabled: true
  # Whether alpha and beta prereleases trigger update notifications
  include-prerelease: false
  # Notify players with clickportals.notify.update permission when they join if an update is available
  notify-on-join: true
  # How often in minutes to re-check Modrinth for updates (0 to check on startup/reload only)
  check-interval-minutes: 360

# Global event sound effects and ambient sound settings (#77)
sounds:
  # Sound played when placing an Aetheryte
  place:
    sound: "minecraft:block.beacon.activate"
    volume: 1.0
    pitch: 1.2
  # Sound played when removing an Aetheryte
  destroy:
    sound: "minecraft:block.beacon.deactivate"
    volume: 1.0
    pitch: 0.9
  # Sound played when interacting with an Aetheryte
  interact:
    sound: "minecraft:block.amethyst_block.chime"
    volume: 1.0
    pitch: 1.0
  # Sound played when warp casting begins
  warp-cast-start:
    sound: "minecraft:block.portal.trigger"
    volume: 0.5
    pitch: 1.5
  # Sound played when warp casting is cancelled
  warp-cast-cancel:
    sound: "minecraft:block.note_block.bass"
    volume: 0.8
    pitch: 0.7
  # Sound played at departure when a player teleports away
  warp-depart:
    sound: "minecraft:entity.enderman.teleport"
    volume: 0.9
    pitch: 1.1
  # Sound played upon teleport arrival
  warp-arrive:
    sound: "minecraft:entity.enderman.teleport"
    volume: 1.0
    pitch: 1.2
  # Sound played to the player on errors or denied actions
  error:
    sound: "minecraft:entity.villager.no"
    volume: 0.8
    pitch: 1.0
  # Periodic ambient sound settings for nearby Aetherytes
  ambient:
    enabled: true
    sound: "minecraft:block.beacon.ambient"
    volume: 0.6
    pitch: 1.2
    # Recipient selection radius in blocks around an Aetheryte (0.0 - 64.0; client attenuation distance scales with volume)
    range: 12.0
    interval-ticks: 80
