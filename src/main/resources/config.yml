# ClickPortals Configuration

# Language and localization settings
language:
  # Fallback locale used for console messages, item names, and unsupported client locales (e.g. en_US, ja_JP)
  default-locale: en_US
  # Whether to automatically switch player-facing messages and holograms to match the player's client language
  use-client-locale: true

# Client-side visual and interaction (PacketEvents Display & Interaction) settings
hologram:
  # Whether PacketEvents client-side displays and interaction hitboxes are enabled
  enabled: true
  # View distance for holograms and models in blocks (minimum 4.0)
  view-distance: 32.0

# Global per-player Aetheryte placement limit and cooldown settings
limits:
  # Maximum total Aetherytes a single player may own across all variations (-1 for unlimited)
  max-aetherytes-per-player: -1
  # Default cooldown in ticks after placing an Aetheryte before placing another (100 = 5 seconds, 0 to disable)
  placement-cooldown-ticks: 100
