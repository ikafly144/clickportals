# ClickPortals Configuration

# Language and localization settings
language:
  # Fallback locale used for console messages, item names, and unsupported client locales (e.g. en_US, ja_JP)
  default-locale: en_US
  # Whether to automatically switch player-facing messages and holograms to match the player's client language
  use-client-locale: true

# Client-side visual and interaction (PacketEvents Display & Interaction) settings
hologram:
  # Whether PacketEvents client-side displays and interaction hitboxes are enabled
  enabled: true
  # View distance for holograms and models in blocks (minimum 4.0)
  view-distance: 32.0

# Global per-player Aetheryte placement limit and cooldown settings
limits:
  # Maximum total Aetherytes a single player may own across all variations (-1 for unlimited)
  max-aetherytes-per-player: -1
  # Default cooldown in ticks after placing an Aetheryte before placing another (100 = 5 seconds, 0 to disable)
  placement-cooldown-ticks: 100
  # Minimum required block distance between Aetherytes in the same world (0 to disable)
  min-distance-between-aetherytes: 0.0
  # Maximum number of favorite Aetherytes a player can save (-1 for unlimited, 0 to disable)
  max-favorites-per-player: -1

# Global warping settings: distance boundaries, costs, and display (#14, #26)
warp:
  # Distance limitations for warping in blocks
  distance:
    # Minimum required distance between Aetherytes to warp (0 for no limit)
    min: 0.0
    # Maximum allowed distance between Aetherytes to warp (-1 for unlimited)
    max: -1.0
    # Whether distance limits (min/max) apply to cross-dimension warps (true by default)
    cross-dimension: true
  # Base warp cost specifications (all entries must be satisfied; $block_distance, $chunk_distance, $balance, etc. available)
  cost: []
  # Whether non-mandatory costs (required: false) are shown in destination menus and tooltips
  show-optional-costs: true
  # Default warp casting (cast time and BetterModel player animation) settings (#65)
  cast:
    # Cast time in ticks before warping (0 or less for instant warp)
    ticks: 0
    # BetterModel player limb model name used for player animations (e.g. steve)
    player-model: "steve"
    # BetterModel player animation played during casting (HOLD_ON_LAST; empty to disable)
    cast-animation: ""
    # BetterModel player animation played after teleport arrival (PLAY_ONCE; empty to disable)
    arrive-animation: ""
    # Whether to prevent the player from moving via PacketEvents while casting (head rotation remains allowed)
    immobilize: true
    # Cancellation conditions while casting
    cancel:
      # Cancel casting when the player moves (coordinate change; head rotation is allowed)
      on-move: true
      # Cancel casting when the player takes damage
      on-damage: true

# Cross-dimension warping routes, distance origins, and dimension pricing (#9)
dimensions:
  # Default cost specifications applied per dimension amount ($amount represents the evaluated dimension amount)
  default-cost:
    - type: vault
      amount: "$amount"
      required: true
    - type: exp-levels
      amount: "3"
      required: false
  # Base dimension amounts per world name
  amounts:
    world: 0.0
    world_nether: 30.0
    world_the_end: 100.0
  # Per-world display names (MiniMessage) and Aetheryte placement/usage restrictions (#63)
  worlds:
    world:
      display-name: ""
      allow-place: true
      allow-use: true
    world_nether:
      display-name: ""
      allow-place: true
      allow-use: true
    world_the_end:
      display-name: ""
      allow-place: true
      allow-use: true
  # Inter-dimensional connections and coordinate origins
  routes:
    - between: [world, world_nether]
      origin:
        world: { type: scale, ratio: 8.0 }
        world_nether: { type: scale, ratio: 0.125 }
    - between: [world, world_the_end]
      origin:
        world: { type: spawn }
        world_the_end: { type: fixed, x: 0.0, z: 0.0 }
      cost-override:
        world_the_end:
          amount: "$default + 300"
