[versions]
paper-api = "26.3.build.244-stable"
jspecify = "1.0.1"
errorprone-core = "2.52.0"
nullaway = "0.14.3"
junit-bom = "6.1.3"
mockito-bom = "5.24.0"
assertj = "3.27.7"
packetevents = "2.14.0"
configurate = "4.2.0"
vault-api = "1.7.1"
bettermodel = "3.6.0"

# Gradle plugins
run-paper = "3.1.0"
resource-factory = "1.4.0"
shadow = "9.6.1"
errorprone-plugin = "5.2.0"
spotless = "8.11.0"
foojay-resolver = "1.0.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
mockito-bom = { module = "org.mockito:mockito-bom", version.ref = "mockito-bom" }
mockito-core = { module = "org.mockito:mockito-core" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
configurate-core = { module = "org.spongepowered:configurate-core", version.ref = "configurate" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
bettermodel-bukkit-api = { module = "io.github.toxicity188:bettermodel-bukkit-api", version.ref = "bettermodel" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
resource-factory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
